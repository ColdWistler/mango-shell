[package]
name = "mango-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A Wayland desktop shell (bar) for the Mango compositor, built with Rust, Relm4 and GTK4."
license = "MIT"
keywords = ["wayland", "mango", "relm4", "gtk4", "statusbar"]
categories = ["gui"]
# repository = "https://github.com/<your-username>/mango-shell"

[dependencies]
# Elm-style MVU framework on top of GTK4.
relm4 = "0.11"
# GTK4 itself (kept as a direct dependency so `gtk::` paths resolve in macros).
# `v4_8` unlocks `GtkPicture::set_content_fit`, used to cover-fit wallpapers.
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
# Turns a GTK4 window into a Wayland layer surface (a bar/panel).
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
# Direct access to Mango's IPC socket. We only need the blocking API.
mango-ipc = { version = "0.6", default-features = false, features = ["blocking"] }
# Toggle the launcher from a Mango keybind: `pkill -SIGUSR1 mango-shell`.
signal-hook = "0.3"
# Hosts the system tray (StatusNotifierItem) and its DBusMenu on the session bus.
system-tray = "0.8"
# Session-bus client for the "now playing" widget, which speaks MPRIS
# (org.mpris.MediaPlayer2.*) — the standard interface every Linux music player
# exposes, from Spotify and Sonora to VLC, mpv and browsers.
#
# `system-tray` already pulls zbus in with its Tokio backend, so this reuses the
# exact same build: no new crates are downloaded, and the blocking API is the
# only feature we turn on. `default-features = false` keeps zbus off its own
# `async-io` backend, matching what is already compiled.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# Async runtime the tray host runs on (system-tray is Tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Used only to hand freed memory back to the OS (`malloc_trim`) after the
# carousel drops a batch of decoded thumbnails.
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
